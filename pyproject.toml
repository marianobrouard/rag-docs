[project]
name = "rag-docs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "langchain-core>=1.7.4",
    "langchain-google-genai>=4.4.2",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.17",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_docs"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
